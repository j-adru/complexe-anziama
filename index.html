<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1A2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anziama">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<title>Complexe Anziama — Gestion locative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="polices" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Thème : clair par défaut, sombre selon l'appareil ou au choix
   ========================================================= */
:root{
  --nuit:#0E1A2B; --or:#B8924A; --creme:#FBF5E2;
  --f-titre:"Manrope"; --f-texte:"Manrope";
  --encre:color-mix(in srgb,var(--nuit) 86%,#fff); --barre-dep:var(--encre);
  --page:#EFEBE2;
  --texte:#121926; --doux:#4A5263; --pale:#6B7384;
  --verre:rgba(255,255,255,.82); --verre-fort:rgba(255,255,255,.94); --verre-leger:rgba(255,255,255,.55);
  --bord-verre:rgba(255,255,255,.9); --ambre:rgba(184,146,74,.30);
  --trait:rgba(24,32,46,.14); --trait2:rgba(24,32,46,.08);
  --champ:rgba(255,255,255,.9); --champ-bord:rgba(24,32,46,.18);
  --ligne-alt:color-mix(in srgb,var(--creme) 72%,transparent);
  --survol:color-mix(in srgb,var(--or) 14%,transparent);
  --entete:var(--nuit); --entete-texte:#F3E6C6;
  --or-texte:color-mix(in srgb,var(--or) 70%,#000); --or-pale:color-mix(in srgb,var(--or) 18%,transparent);
  --ok:#24704B; --ok-fond:rgba(46,106,78,.13); --ko:#A12C2C; --ko-fond:rgba(156,47,47,.12);
  --att:#8A5A00; --att-fond:rgba(201,140,20,.15); --gris-fond:rgba(24,32,46,.07); --bleu:#2D5B8A; --bleu-fond:rgba(45,91,138,.12);
  --ombre:0 10px 30px -8px rgba(10,18,32,.16);
  --rayon:14px;
  /* Boutons : relief doux, contour doré, enfoncement au toucher */
  --btn-fond:linear-gradient(180deg,#FFFBF0,#F1E2BF);
  --btn-bord:rgba(168,128,56,.55);
  --btn-ico:#9A7432;
  --btn-ombre:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(14,26,43,.10),0 6px 14px -5px rgba(14,26,43,.22);
  --btn-ombre-presse:inset 0 2px 4px rgba(14,26,43,.14);
  --btn-on:linear-gradient(180deg,#F6E3B4,#E2C27F);
}
:root[data-theme="dark"]{
  --btn-fond:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  --btn-bord:rgba(217,189,126,.32);
  --btn-ombre:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.45),0 8px 18px -6px rgba(0,0,0,.6);
  --btn-ombre-presse:inset 0 2px 5px rgba(0,0,0,.45);
  --btn-on:linear-gradient(180deg,rgba(217,189,126,.30),rgba(217,189,126,.12));
  --btn-ico:#E2C88E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --btn-fond:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
    --btn-bord:rgba(217,189,126,.32);
    --btn-ombre:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.45),0 8px 18px -6px rgba(0,0,0,.6);
    --btn-ombre-presse:inset 0 2px 5px rgba(0,0,0,.45);
    --btn-on:linear-gradient(180deg,rgba(217,189,126,.30),rgba(217,189,126,.12));
    --btn-ico:#E2C88E;
  }
}
:root[data-theme="dark"]{
  --texte:#ECEFF4; --doux:#B3BBC8; --pale:#8C95A5;
  --page:#0B1220;
  --verre:rgba(14,22,37,.58); --verre-fort:rgba(15,24,40,.92); --verre-leger:rgba(255,255,255,.05);
  --bord-verre:rgba(255,255,255,.11); --ambre:rgba(217,177,102,.22);
  --trait:rgba(255,255,255,.12); --trait2:rgba(255,255,255,.07);
  --champ:rgba(255,255,255,.06); --champ-bord:rgba(255,255,255,.16);
  --ligne-alt:rgba(217,189,126,.06); --survol:rgba(217,189,126,.10);
  --entete:rgba(255,255,255,.07); --entete-texte:#E9D9B4;
  --or-texte:#E2C88E; --or-pale:rgba(217,189,126,.15);
  --ok:#8FD1AC; --ok-fond:rgba(94,156,122,.18); --ko:#F2A29B; --ko-fond:rgba(201,112,106,.2);
  --att:#EBC77F; --att-fond:rgba(217,178,102,.17); --gris-fond:rgba(255,255,255,.08); --bleu:#9EC3EE; --bleu-fond:rgba(110,160,220,.17);
  --ombre:0 12px 36px rgba(0,0,0,.4); --barre-dep:#8C9BB4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --texte:#ECEFF4; --doux:#B3BBC8; --pale:#8C95A5;
    --page:#0B1220;
    --verre:rgba(14,22,37,.58); --verre-fort:rgba(15,24,40,.92); --verre-leger:rgba(255,255,255,.05);
    --bord-verre:rgba(255,255,255,.11); --ambre:rgba(217,177,102,.22);
    --trait:rgba(255,255,255,.12); --trait2:rgba(255,255,255,.07);
    --champ:rgba(255,255,255,.06); --champ-bord:rgba(255,255,255,.16);
    --ligne-alt:rgba(217,189,126,.06); --survol:rgba(217,189,126,.10);
    --entete:rgba(255,255,255,.07); --entete-texte:#E9D9B4;
    --or-texte:#E2C88E; --or-pale:rgba(217,189,126,.15);
    --ok:#8FD1AC; --ok-fond:rgba(94,156,122,.18); --ko:#F2A29B; --ko-fond:rgba(201,112,106,.2);
    --att:#EBC77F; --att-fond:rgba(217,178,102,.17); --gris-fond:rgba(255,255,255,.08); --bleu:#9EC3EE; --bleu-fond:rgba(110,160,220,.17);
    --ombre:0 12px 36px rgba(0,0,0,.4); --barre-dep:#8C9BB4;
  }
}
/* Texte posé directement sur l'image de fond */
body.fond-sombre{--texte-page:#F2F4F8;--doux-page:rgba(242,244,248,.75)}
body.fond-clair{--texte-page:#18202E;--doux-page:#4A5262}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--f-texte),system-ui,-apple-system,sans-serif;font-size:15px;color:var(--texte);background:var(--page);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
a{color:var(--or-texte)}
h1,h2{font-family:var(--f-titre),system-ui,sans-serif}

/* Fond d'écran : les fonds proposés sont dessinés en CSS (rien à télécharger) */
#fond{position:fixed;inset:0;z-index:-2;background:var(--page);background-size:cover;background-position:center}
#fond:after{content:"";position:absolute;inset:0;background:var(--voile,transparent)}

/* Verre : transparence, flou de ce qu'il y a derrière, contour clair avec une touche d'ambre */
.carte,.tab-wrap,.doc,.fenetre,.resume-bail,.calcul,.liste-locaux button,.choix button,.portes-choix button,.onglets,.barre button,.alerte,.toast,.btn{
  background:var(--verre);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--bord-verre);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px var(--ambre),var(--ombre)}
.liste-locaux button,.choix button,.portes-choix button,.onglets,.barre button,.alerte,.calcul,.resume-bail,.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 0 0 1px var(--ambre)}
.carte .tab-wrap,.fenetre .tab-wrap,.doc .tab-wrap,.fenetre .resume-bail,.fenetre .calcul,.doc .calcul{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--verre-leger)}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:rgba(9,16,29,.84);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border-right:1px solid rgba(255,255,255,.08);box-shadow:inset -1px 0 0 rgba(217,177,102,.18);color:#C9D1DE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.plaque{margin:22px 18px 14px;padding:16px 10px 14px;border:1px solid rgba(217,189,126,.5);text-align:center;position:relative}
.plaque:after{content:"";position:absolute;inset:4px;border:1px solid rgba(217,189,126,.2);pointer-events:none}
.plaque img{max-width:84px;max-height:96px;display:block;margin:0 auto 10px}
.plaque .petit{font-family:var(--f-titre),system-ui,sans-serif;font-size:11px;letter-spacing:.38em;color:#D9BD7E}
.plaque .grand{font-family:var(--f-titre),system-ui,sans-serif;font-size:25px;font-weight:600;letter-spacing:.14em;color:#F3E6C6;margin-top:4px}
.plaque .adr{font-size:12px;color:#8E9AAE;margin-top:6px}
.nav{padding:4px 10px 18px;display:flex;flex-direction:column;gap:2px}
.nav .groupe{font-size:12px;color:#7D8AA0;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:#C9D1DE;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14.5px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.actif{background:rgba(255,255,255,.1);color:#F3E6C6;box-shadow:inset 3px 0 0 #D9BD7E}
.nav button.actif svg{opacity:1;color:#D9BD7E}
.side .pied{margin-top:auto;padding:14px 22px 20px;font-size:12px;color:#7D8AA0;border-top:1px solid rgba(255,255,255,.06)}

.main{min-width:0;padding:16px 36px 70px}
.barre{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--doux-page,var(--doux));flex-wrap:wrap}
.barre .marque-mob{display:none;margin-right:auto;align-items:center;gap:10px;color:var(--texte-page,var(--texte))}
.barre .marque-mob img{height:30px}
.barre .marque-mob b{font-family:var(--f-titre),system-ui,sans-serif;letter-spacing:.14em;font-size:16px}
.barre button{border-radius:10px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--texte)}
.barre button:hover{border-color:var(--or)}
.barre svg{width:16px;height:16px}
.barre button.etat{border-radius:20px}
.etat i{width:9px;height:9px;border-radius:50%;background:#5E9C7A;box-shadow:0 0 0 3px rgba(94,156,122,.2);flex:none}
.etat.attente i{background:#D9B266;box-shadow:0 0 0 3px rgba(217,178,102,.25)}
.etat.horsligne i{background:#C9706A;box-shadow:0 0 0 3px rgba(201,112,106,.25)}
.entete{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.entete h1{font-weight:600;font-size:28px;margin:0;color:var(--texte-page,var(--texte));letter-spacing:-.01em}
.entete p{margin:4px 0 0;color:var(--doux-page,var(--doux));max-width:70ch}
.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Éléments ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:11px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--texte);min-height:40px}
.btn:hover{border-color:var(--or)}
.btn svg{width:17px;height:17px}
.btn.prim{background:var(--nuit);border-color:rgba(217,189,126,.45);color:#F3E6C6}
:root[data-theme="dark"] .btn.prim{background:linear-gradient(180deg,#D9BD7E,#B8924A);color:#14100A;border-color:rgba(255,236,190,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.prim{background:linear-gradient(180deg,#D9BD7E,#B8924A);color:#14100A;border-color:rgba(255,236,190,.6)}}
.btn.prim:hover{filter:brightness(1.08)}
.btn.vert{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.btn.rouge{background:#A12C2C;border-color:#A12C2C;color:#fff}
.btn.danger{color:var(--ko)}
.btn.mini{padding:5px 10px;font-size:13.5px;min-height:32px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

.carte{border-radius:var(--rayon);padding:20px 22px}
.carte h2{font-weight:600;font-size:18px;margin:0 0 14px;color:var(--texte)}
.carte h3,.corps h3,.doc h3{font-size:15px;margin:0 0 10px}
.grille{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:18px}

.chiffre .val{font-size:27px;font-weight:700;margin-top:4px}
.chiffre .lib{color:var(--doux);font-size:14px}
.chiffre .sous{color:var(--pale);font-size:13px;margin-top:4px}
.chiffre.rouge .val{color:var(--ko)}

.pastille{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-fond);color:var(--ok)}
.p-ko{background:var(--ko-fond);color:var(--ko)}
.p-att{background:var(--att-fond);color:var(--att)}
.p-gris{background:var(--gris-fond);color:var(--doux)}
.p-or{background:var(--or-pale);color:var(--or-texte)}
.p-bleu{background:var(--bleu-fond);color:var(--bleu)}
.estime{display:inline-block;font-size:11.5px;color:var(--att);background:var(--att-fond);border-radius:4px;padding:0 5px;margin-left:5px;cursor:help}
.attente-ico{display:inline-block;font-size:11px;color:var(--att);margin-left:6px;white-space:nowrap}
.idb{font-size:12px;color:var(--pale);font-weight:500}
.mrq-red{display:inline-block;font-size:10.5px;font-weight:600;line-height:1.35;color:var(--or);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px;cursor:help}
.badge-lecture{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--or);border:1px solid color-mix(in srgb,var(--or) 55%,transparent);white-space:nowrap}
.btn.btn-choix{justify-content:flex-start;width:100%;text-align:left;height:auto;min-height:0;padding:12px 16px;white-space:normal}
.btn.btn-choix svg{flex:none}.btn.btn-choix span{flex:1;min-width:0;line-height:1.35}
.code-visiteur{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:1px}
.neg{color:var(--ko)}
.muet{color:var(--pale)}

/* Montants masquables */
body.masque .som:not(.vu){filter:blur(7px);cursor:pointer;user-select:none}
.som{transition:filter .15s}

/* Tableaux : une ligne claire, une ligne crème */
.tab-wrap{overflow:auto;border-radius:var(--rayon)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--entete);color:var(--entete-texte);font-weight:600;text-align:left;padding:11px 12px;white-space:nowrap;position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
table.t th .fl{opacity:.7;font-size:11px;margin-left:4px}
table.t td{padding:10px 12px;border-bottom:1px solid var(--trait2);vertical-align:top}
table.t td:first-child,table.t td a{white-space:nowrap}
table.t tr.z td{background:var(--ligne-alt)}
table.t tr.cliq{cursor:pointer}
table.t tr.cliq:hover td{background:var(--survol)}
table.t td.d,table.t th.d{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.grp td{background:color-mix(in srgb,var(--nuit) 80%,transparent);color:#F3E6C6;font-weight:600;border-bottom:0}
table.t tr.grp td .sub{color:#D9BD7E;font-weight:500}
table.t tr.tot td{background:var(--or-pale);font-weight:700;border-top:2px solid var(--or)}
table.t tr.nonpaye td{background:var(--ko-fond)}
table.t tr.detail td{background:var(--verre-leger);font-size:13px;color:var(--doux);padding:4px 12px 10px 28px}
table.t tr.detail[hidden]{display:none}
.lien-det{border:0;background:none;padding:0;color:var(--or-texte);cursor:pointer;font-weight:600;text-decoration:underline;font-size:13.5px}
.vide{padding:34px;text-align:center;color:var(--doux)}

/* Formulaires */
.champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.champs .plein{grid-column:1/-1}
label.ch{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--doux);font-weight:500}
label.ch input,label.ch select,label.ch textarea,.filtre select,.filtre input,.mini-champ{border:1px solid var(--champ-bord);border-radius:10px;padding:10px 11px;background:var(--champ);color:var(--texte);font-size:15px;min-width:0}
select option{background:#fff;color:#18202E}
.mini-champ{max-width:100%}
label.ch input[type=color]{padding:3px;height:44px;cursor:pointer;width:100%}
label.ch input:focus,label.ch select:focus,label.ch textarea:focus{border-color:var(--or);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--or) 22%,transparent)}
label.ch .aide{font-weight:400;color:var(--pale);font-size:12.5px}
.filtres{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtre{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--doux-page,var(--doux))}
.filtre select,.filtre input{padding:8px 10px;font-size:14px}
.choix{display:flex;gap:8px;flex-wrap:wrap}
.choix button{border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;min-width:150px;flex:1;color:var(--texte)}
.choix button b{display:block;font-size:14.5px}
.choix button span{font-size:12.5px;color:var(--doux)}
.choix button.on,.portes-choix button.on{border-color:var(--or);box-shadow:0 0 0 2px color-mix(in srgb,var(--or) 45%,transparent)}
.onglets{display:inline-flex;border-radius:12px;overflow:hidden}
.onglets button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:500;color:var(--doux);min-height:40px}
.onglets button.on{background:var(--nuit);color:#F3E6C6}

.liste-alertes{display:flex;flex-direction:column;gap:8px}
.alerte{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px}
.alerte .pastille{flex:none;margin-top:1px}

/* Détail du mois */
.mois-detail{display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:start}
.anneau{position:relative;width:190px;height:190px}
.anneau .centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.anneau .centre b{font-size:30px}
.anneau .centre span{font-size:12.5px;color:var(--doux)}
.totaux-mois{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.totaux-mois div>span{display:block;font-size:12.5px;color:var(--doux)}
.totaux-mois div>b{font-size:19px}
.barre-prog{height:10px;border-radius:8px;background:var(--gris-fond);overflow:hidden;margin:6px 0 4px}
.barre-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--or),color-mix(in srgb,var(--or) 55%,#fff));transition:width .6s}
.liste-locaux{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin-top:14px}
.liste-locaux button{display:flex;justify-content:space-between;gap:10px;align-items:center;border-radius:10px;padding:7px 11px;cursor:pointer;text-align:left;font-size:13px;color:var(--texte)}
.liste-locaux button:hover{border-color:var(--or)}
.liste-locaux .nom{display:block;line-height:1.3}
.liste-locaux .sous{display:block;font-size:11.5px;color:var(--pale)}
.liste-locaux .pastille{font-size:11px;padding:1px 7px}

/* Encaisser */
.portes-choix{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.portes-choix button{border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--texte)}
.portes-choix .id{font-family:var(--f-titre),system-ui,sans-serif;font-weight:700;font-size:17px}
.portes-choix .qui{font-weight:600;font-size:14px;margin-top:2px}
.portes-choix .etat-l{font-size:12.5px;margin-top:6px}
.resume-bail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-radius:12px;padding:14px 16px;margin-bottom:18px}
.resume-bail>div>span{display:block;font-size:12.5px;color:var(--doux)}
.resume-bail>div>b{font-size:17px}
.reste-info{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--gris-fond)}
.infos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;margin-bottom:16px}
.infos>div>span:first-child{display:block;color:var(--doux);font-size:12.5px}

/* Calcul de garantie */
.calcul{border-radius:12px;overflow:hidden}
.calcul .l{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--trait2)}
.calcul .l:nth-child(even){background:var(--ligne-alt)}
.calcul .l.s{font-weight:700;background:var(--or-pale)}
.calcul .l.final{background:var(--nuit);color:#F3E6C6;font-size:17px;font-weight:700}
.calcul .l .m{font-variant-numeric:tabular-nums;white-space:nowrap}
.calcul .mois{padding:6px 14px 10px 30px;font-size:13.5px;color:var(--doux)}
.calcul .mois label{display:flex;gap:8px;align-items:center;padding:3px 0}

.graph svg{width:100%;height:auto;display:block}
.graph rect.b{cursor:pointer}
.legende{display:flex;gap:16px;font-size:13px;color:var(--doux);margin-top:6px;flex-wrap:wrap}
.legende i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* Fonds proposés */
.fonds{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.fonds button{height:74px;border-radius:12px;border:2px solid rgba(255,255,255,.4);cursor:pointer;background-size:cover;background-position:center;position:relative;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:flex-end;padding:6px 8px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.fonds button.on{border-color:var(--or);box-shadow:0 0 0 3px color-mix(in srgb,var(--or) 35%,transparent)}

/* Fenêtre */
.voile{position:fixed;inset:0;background:rgba(6,11,20,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.fenetre{background:var(--verre-fort);border-radius:18px;width:min(720px,100%);animation:entree .18s ease-out}
.fenetre.large{width:min(1000px,100%)}
@keyframes entree{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fenetre{animation:none}.som,.barre-prog i{transition:none}}
.fenetre .tete{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--trait2)}
.fenetre .tete h2{font-weight:600;font-size:19px;margin:0}
.fenetre .corps{padding:20px 22px;max-height:calc(100vh - 220px);overflow:auto}
.fenetre .pieds{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--trait2);flex-wrap:wrap}
.fenetre .pieds .gauche{margin-right:auto}
.x{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--doux);min-width:44px;min-height:44px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:var(--texte);background:var(--verre-fort);padding:12px 18px;border-radius:14px;z-index:80;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
.toast.err{background:#A12C2C;color:#fff;border-color:#A12C2C}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;cursor:pointer}
.occupe{position:fixed;inset:0;background:rgba(6,11,20,.25);z-index:70;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff}
.chargement{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:12px;color:var(--doux-page,#555);text-align:center;padding:20px}
.chargement .grand{font-family:var(--f-titre),system-ui,sans-serif;font-size:32px;font-weight:600;letter-spacing:.16em;color:var(--texte-page,#18202E)}

/* Documents imprimables */
.doc{border-radius:var(--rayon);padding:30px 34px}
.doc-tete{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid var(--texte);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
.doc-tete .marque{display:flex;align-items:center;gap:14px}
.doc-tete .marque img{max-height:54px;max-width:110px}
.doc-tete .marque b{font-family:var(--f-titre),system-ui,sans-serif;font-size:22px;letter-spacing:.1em;display:block}
.doc-tete .marque small{display:block;font-size:13px;color:var(--doux);margin-top:2px}
.doc-tete .titre{text-align:right}
.doc-tete .titre b{font-family:var(--f-titre),system-ui,sans-serif;font-weight:600;font-size:19px;display:block}
.doc-tete .titre span{font-size:13px;color:var(--doux)}
.doc-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px;font-size:14px}
.doc-info>div>span:first-child{display:block;color:var(--doux);font-size:12.5px}
/* Relevés : en-tête en largeur, lignes sans retour à la ligne, totaux clairs */
.rel-tete{display:flex;flex-wrap:wrap;gap:10px 36px;margin-bottom:18px;font-size:14px}
.rel-tete>div{white-space:nowrap}
.rel-tete>div>span{display:block;color:var(--doux);font-size:12.5px}
table.t.rel td{white-space:nowrap}
table.t.rel .m-c{display:none}
.rel-totaux{margin:14px 0 0 auto;width:fit-content;min-width:320px;max-width:100%;font-size:14px}
.rel-totaux>div{display:flex;justify-content:space-between;gap:24px;padding:7px 12px;border-bottom:1px solid var(--trait2);white-space:nowrap}
.rel-totaux>div b{font-variant-numeric:tabular-nums}
.rel-totaux>div.reste{margin-top:6px;border:2px solid var(--ko);border-radius:8px;background:var(--ko-fond);color:var(--ko);font-size:17px;font-weight:700}
.rel-totaux>div.reste.ajour{border-color:var(--ok);background:var(--ok-fond);color:var(--ok)}
.doc-pied{margin-top:22px;font-size:12.5px;color:var(--pale);border-top:1px solid var(--trait2);padding-top:10px}
.signatures{display:flex;justify-content:space-between;margin-top:40px;font-size:13px;color:var(--doux)}
.mouvements{display:flex;flex-direction:column;gap:2px;font-size:13.5px;margin-top:10px}
.mouvements div{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px dotted var(--trait)}
.recu-apercu{display:flex;justify-content:center;background:var(--gris-fond);border-radius:12px;padding:14px}
.recu-apercu img{max-width:100%;max-height:62vh;box-shadow:0 6px 24px rgba(0,0,0,.18);background:#fff}
#impression{display:none}
#impression img.recu-img{width:100%;max-width:150mm;display:block;margin:0 auto 8mm;page-break-inside:avoid}

/* Barre du bas (téléphone) */
.navmob{display:none}

/* Boutons : un vrai relief, partout */
.btn,.choix button,.portes-choix button,.liste-locaux button{background:var(--btn-fond);border:1px solid var(--btn-bord);box-shadow:var(--btn-ombre);transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.btn:active,.choix button:active,.portes-choix button:active,.liste-locaux button:active{transform:scale(.97);box-shadow:var(--btn-ombre-presse)}
.btn.prim{background:linear-gradient(180deg,#E4C98C,#B8924A);border-color:rgba(150,112,46,.7);color:#14100A;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(80,56,14,.3),0 8px 18px -6px rgba(150,112,46,.55)}
.btn.prim svg{color:#14100A}
.btn svg,.barre button svg{color:var(--btn-ico)}
.barre button{background:var(--btn-fond);border:1px solid var(--btn-bord);box-shadow:var(--btn-ombre)}
.btn:hover,.barre button:hover,.choix button:hover,.portes-choix button:hover,.liste-locaux button:hover{border-color:var(--or)}
:root[data-theme="dark"] .btn.prim{background:linear-gradient(180deg,#E4C98C,#B8924A);color:#14100A;border-color:rgba(255,236,190,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.4),0 8px 20px -6px rgba(184,146,74,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.prim{background:linear-gradient(180deg,#E4C98C,#B8924A);color:#14100A;border-color:rgba(255,236,190,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.4),0 8px 20px -6px rgba(184,146,74,.55)}}
.choix button.on,.portes-choix button.on{background:var(--btn-on);border-color:var(--or);box-shadow:0 0 0 2px color-mix(in srgb,var(--or) 45%,transparent),var(--btn-ombre)}
/* Onglets façon Apple : un rail creux, l'onglet choisi en relief */
.onglets{padding:3px;gap:2px;background:var(--gris-fond);border:1px solid var(--trait2);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.onglets button{border-radius:9px;min-height:36px;padding:7px 14px}
.onglets button.on{background:var(--btn-on);color:var(--texte);box-shadow:var(--btn-ombre);border:1px solid var(--btn-bord);font-weight:600}
/* Choix « qu'est-ce qui a été payé » : six boutons de même taille */
.choix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choix button{min-width:0;height:66px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.choix button b,.choix button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portes-choix button{display:flex;flex-direction:column;justify-content:center;min-width:0}
.portes-choix .qui{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Infos en colonnes, sans cadre */
.infos-ligne{display:flex;flex-wrap:wrap;gap:10px 26px;margin:2px 0 18px;font-size:14px}
.infos-ligne>div{white-space:nowrap}
.infos-ligne>div>span{display:block;color:var(--doux);font-size:12.5px}
.infos-ligne b{font-size:16px}
.barre-outils{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.barre-outils .doc-btn{margin-left:8px}
.mob-seul{display:none}
/* Mode clair sur PC : le menu de gauche suit le thème */
:root[data-theme="light"] .side{background:rgba(255,251,242,.86);color:#2A3242;border-right:1px solid rgba(168,128,56,.25);box-shadow:inset -1px 0 0 rgba(255,255,255,.6),6px 0 24px -12px rgba(60,45,15,.18)}
:root[data-theme="light"] .plaque{border-color:rgba(168,128,56,.55)}
:root[data-theme="light"] .plaque:after{border-color:rgba(168,128,56,.22)}
:root[data-theme="light"] .plaque .petit{color:#9A7432}
:root[data-theme="light"] .plaque .grand{color:#0E1A2B}
:root[data-theme="light"] .plaque .adr,:root[data-theme="light"] .nav .groupe,:root[data-theme="light"] .side .pied{color:#7A6A4C}
:root[data-theme="light"] .side .pied{border-top-color:rgba(168,128,56,.18)}
:root[data-theme="light"] .nav button{color:#2A3242}
:root[data-theme="light"] .nav button svg{color:#9A7432;opacity:1}
:root[data-theme="light"] .nav button:hover{background:rgba(184,146,74,.12);color:#0E1A2B}
:root[data-theme="light"] .nav button.actif{background:linear-gradient(180deg,#F6E3B4,#E7CB8C);color:#14100A;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px -4px rgba(150,112,46,.45)}
:root[data-theme="light"] .nav button.actif svg{color:#6E4F16}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) .side{background:rgba(255,251,242,.86);color:#2A3242;border-right:1px solid rgba(168,128,56,.25);box-shadow:inset -1px 0 0 rgba(255,255,255,.6),6px 0 24px -12px rgba(60,45,15,.18)}
  :root:not([data-theme="dark"]) .plaque{border-color:rgba(168,128,56,.55)}
  :root:not([data-theme="dark"]) .plaque:after{border-color:rgba(168,128,56,.22)}
  :root:not([data-theme="dark"]) .plaque .petit{color:#9A7432}
  :root:not([data-theme="dark"]) .plaque .grand{color:#0E1A2B}
  :root:not([data-theme="dark"]) .plaque .adr,:root:not([data-theme="dark"]) .nav .groupe,:root:not([data-theme="dark"]) .side .pied{color:#7A6A4C}
  :root:not([data-theme="dark"]) .side .pied{border-top-color:rgba(168,128,56,.18)}
  :root:not([data-theme="dark"]) .nav button{color:#2A3242}
  :root:not([data-theme="dark"]) .nav button svg{color:#9A7432;opacity:1}
  :root:not([data-theme="dark"]) .nav button:hover{background:rgba(184,146,74,.12);color:#0E1A2B}
  :root:not([data-theme="dark"]) .nav button.actif{background:linear-gradient(180deg,#F6E3B4,#E7CB8C);color:#14100A;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px -4px rgba(150,112,46,.45)}
  :root:not([data-theme="dark"]) .nav button.actif svg{color:#6E4F16}
}
/* Mode sombre sur PC : menu en verre, comme sur téléphone */
.side{background:rgba(9,16,29,.62)}
.nav button.actif{background:linear-gradient(180deg,rgba(217,189,126,.22),rgba(217,189,126,.08));box-shadow:inset 0 0 0 1px rgba(217,189,126,.3)}
/* Factures du mois (accueil) */
.factures-mois{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.factures-mois .titre-f{font-size:12.5px;color:var(--doux)}
.factures-mois button{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--texte);background:var(--btn-fond);border:1px solid var(--btn-bord);box-shadow:var(--btn-ombre)}
.factures-mois button .sous{display:block;font-size:12px;color:var(--pale)}
.ell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw{white-space:nowrap}
.onglets .court{display:none}
.resume-mob{display:none}
.actions-accueil .court{display:none}

@media print{
  html:root,html:root[data-theme],html:root:not([data-theme="light"]){--texte:#18202E;--doux:#555D6C;--pale:#7E8592;--ligne-alt:#FBF5E2;--entete:#0E1A2B;--entete-texte:#fff;--trait:#DDD;--trait2:#E5E0D3;--verre:#fff;--verre-leger:#fff;--or-pale:#F1E7CF;--ko:#A12C2C;--ok:#24704B;--att:#8A5A00;--gris-fond:#EEE}
  body{background:#fff}
  #fond{display:none}
  body.imprime .app,body.imprime .voile,body.imprime .toast,body.imprime .navmob{display:none!important}
  body.imprime #impression{display:block}
  .doc,.tab-wrap,.calcul{border:0;padding:0;background:#fff;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;overflow:visible}
  .som{filter:none!important}
  table.t tr.detail[hidden]{display:table-row}
  table.t th{background:#0E1A2B!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:static}
  table.t tr.z td,table.t tr.grp td,table.t tr.tot td,.calcul .l.final,.rel-totaux .reste{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.t.rel{font-size:12.5px}
  table.t.rel th,table.t.rel td{padding:7px 8px}
  table.t.rel .lien-det{font-size:12.5px}
  @page{margin:12mm}
}
/* Appli installée sur iPhone : la barre de l'heure est par-dessus la page. Le fond passe dessous, le contenu commence plus bas. */
.main{padding-top:calc(16px + env(safe-area-inset-top))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.mois-detail{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:calc(18px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
  .barre .marque-mob{display:flex}
  .barre .txt-btn{display:none}
  .barre button{min-height:42px;min-width:42px;justify-content:center}
  .g2,.champs,.resume-bail,.doc-info,.infos,.totaux-mois{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .chiffre .val{font-size:21px}
  .carte{padding:16px}
  .entete h1{font-size:23px}
  .entete .outils{width:100%}
  .entete .outils .btn{flex:1 1 auto}
  .btn{min-height:46px}
  .btn.mini{min-height:38px}
  label.ch input,label.ch select,label.ch textarea,.filtre select,.filtre input,.mini-champ{font-size:16px;min-height:46px}
  .filtre{flex:1 1 140px}
  .anneau{margin:0 auto}
  .doc{padding:16px}
  .doc-tete .titre{text-align:left}
  .liste-locaux{grid-template-columns:1fr}
  .liste-locaux button{padding:10px 12px;font-size:14px}
  .voile{padding:0;align-items:flex-end}
  .fenetre,.fenetre.large{width:100%;border-radius:20px 20px 0 0;max-height:calc(94vh - env(safe-area-inset-top));display:flex;flex-direction:column}
  .fenetre .corps{max-height:none;flex:1;overflow:auto;padding:16px}
  .fenetre .pieds{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .fenetre .pieds .btn{flex:1 1 auto}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom))}
  .barre{gap:6px}
  .barre button{min-height:40px;min-width:40px;padding:6px 9px}
  .barre .etat:not(.attente):not(.horsligne) span{display:none}
  .barre .marque-mob b{font-size:14px}
  .portes-choix{grid-template-columns:repeat(2,minmax(0,1fr))}
  .carte>div>select.mini-champ{display:block;width:100%;margin-top:6px}
  .navmob{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:12px;right:12px;bottom:max(10px,calc(env(safe-area-inset-bottom) - 22px));z-index:40;border-radius:32px;padding:8px;background:rgba(9,16,29,.74);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(217,177,102,.22),0 12px 30px rgba(0,0,0,.35)}
  .navmob button{background:none;border:0;color:#C9D1DE;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:9px 2px;border-radius:24px;min-height:62px;cursor:pointer}
  .navmob button svg{width:22px;height:22px}
  .navmob button.actif{background:rgba(255,255,255,.1);color:#F3E6C6}
  .navmob button.actif svg{color:#D9BD7E}
}
/* Tableaux en cartes sur téléphone */
@media screen and (max-width:700px){
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t thead{display:none}
  table.t tr{padding:10px 14px;border-bottom:1px solid var(--trait)}
  table.t tr.z td,table.t tr.cliq:hover td{background:none}
  table.t tr.z{background:var(--ligne-alt)}
  table.t td{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border:0;text-align:right;white-space:normal!important}
  table.t td::before{content:attr(data-l);color:var(--doux);text-align:left;font-weight:500;flex:none;max-width:45%}
  table.t td[data-l=""]::before,table.t td:not([data-l])::before{display:none}
  table.t td:empty{display:none}
  table.t tr.grp,table.t tr.tot{padding:10px 14px}
  table.t tr.grp td,table.t tr.tot td{display:block;text-align:left;background:none;border:0}
  table.t tr.grp{background:color-mix(in srgb,var(--nuit) 82%,transparent);color:#F3E6C6}
  table.t tr.tot{background:var(--or-pale)}
  table.t tr.nonpaye{background:var(--ko-fond)}
  table.t tr.nonpaye td{background:none}
  table.t tr.detail td{display:block;padding:4px 0 6px;text-align:left}
  /* Relevés sur téléphone : vrai tableau compact, une ligne par mois (Mois, Dû, Payé, Reste, Statut) */
  table.t.rel{display:table;width:100%;font-size:13.5px}
  table.t.rel thead{display:table-header-group}
  table.t.rel tbody{display:table-row-group}
  table.t.rel tr{display:table-row;padding:0;border:0}
  table.t.rel th{padding:9px 6px;position:static}
  table.t.rel td{display:table-cell;padding:11px 6px;border-bottom:1px solid var(--trait2);text-align:left;white-space:nowrap!important;vertical-align:middle}
  table.t.rel th:first-child,table.t.rel td:first-child{padding-left:10px}

function soumettre(op){

  var json=JSON.stringify(op.list||op);
  if(/"…/.test(json)){toast('Un instant : la ligne précédente est encore en cours d\'envoi.',1);return null;}
  op.uid=op.uid||nouvelUid();op.essais=0;

function envoyer(){
  if(ENVOI||!FILE.length)return;
  ENVOI=true;var lot=FILE.slice(0,12);lot.forEach(function(o){o.enVol=true});majEtat();
  call('sync',lot.map(function(o){return {uid:o.uid,kind:o.kind,list:o.list,table:o.table,id:o.id,params:o.params,lot:o.lot}})).then(function(res){
    EN_LIGNE=true;ERREUR_ENVOI='';var refus=false,suites=[];
    res.forEach(function(r){
      var op=FILE.find(function(o){return o.uid===r.uid});FILE=FILE.filter(function(o){return o.uid!==r.uid});
      if(r.ok){appliquerDelta(r);if(op&&op.annulerApres)suites.push(function(){annulerMaintenant(op.uid)});else if(op&&op.apres)suites.push(function(){op.apres(r)});}
      else{refus=true;toast('Pas enregistré'+(op&&op.desc?' ('+op.desc+')':'')+' : '+r.erreur+' L\'écran est revenu à l\'état d\'avant.',1);}
    });

    suites.forEach(function(f){f()});

    ENVOI=false;var reseau=estReseau(e)||estRefusCode(e);lot.forEach(function(o){o.enVol=false;o.essais=(o.essais||0)+1});
    ERREUR_ENVOI=String(e&&e.message||e);if(reseau)EN_LIGNE=false;

      var uids=lot.map(function(o){return o.uid});FILE=FILE.filter(function(o){return uids.indexOf(o.uid)<0});

      sauverCache();reconstruire();rendre();

}

function calculerFactures(){

    var m=periode(j),occ=D.baux.filter(function(b){return occupeMois(b,m)}).sort(function(a,b){return a.local.localeCompare(b.local)}),n=occ.length;
    return {j:j,m:m,nature:j.type.split(' ')[0],occ:occ,n:n,partUSD:n?j.usd/n:0,partMont:n?j.montant/n:0,devise:j.devise,taux:j.usd?j.montant/j.usd:1};

function partsBail(b,J){

    if(!g[k])g[k]={cle:k,nature:F.nature,m:F.m,partUSD:0,partMont:0,devise:F.devise,taux:F.taux,factures:[]};

function appliquerFond(p){

function luminanceImage(src){return new Promise(function(res){var i=new Image();i.onload=function(){try{var c=document.createElement('canvas');c.width=24;c.height=24;var x=c.getContext('2d');x.drawImage(i,0,0,24,24);var d=x.getImageData(0,0,24,24).data,s=0;for(var k=0;k<d.length;k+=4)s+=0.2126*d[k]+0.7152*d[k+1]+0.0722*d[k+2];res(s/(d.length/4)/255);}catch(e){res(0.3)}};i.onerror=function(){res(0.3)};i.src=src;});}

/* =========================================================
   Démarrage : d'abord la copie gardée sur l'appareil (affichage immédiat),
   puis Google en arrière-plan. Logo et fond ne sont retéléchargés que s'ils ont changé.
   ========================================================= */
/** Lien d'invitation d'un visiteur : …/#visiteur=… (adresse Google + code visiteur), lu une fois puis effacé de la barre d'adresse. */
function lireInvitation(){
  var m=/[#&]visiteur=([^&]+)/.exec(location.hash||'');if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  var x;try{x=JSON.parse(atob(decodeURIComponent(m[1])))}catch(e){return}
  if(!x||!/^https:\/\/script\.google\.com\/.+\/exec$/.test(x.u||'')||!x.c)return;
  var avant=apiConf(),cache=lsGet('anziama_D');if(avant&&avant.url===x.u&&avant.cle===x.c)return;
  if((lsGet('anziama_file')||[]).length){alert('Des changements de cet appareil ne sont pas encore envoyés à Google : le lien visiteur n\'a pas été appliqué.');return;}
  if(avant&&!(cache&&cache.d&&cache.d.role==='lecture')&&!confirm('Cet appareil gère déjà les données. Le passer en visiteur (lecture seule) ?'))return;
  lsSet('anziama_api',{url:x.u,cle:x.c});try{localStorage.removeItem('anziama_D')}catch(e){}
}
function demarrer(){
  appliquerTheme();
  if(APPLI_INSTALLEE&&!window.MOCK_API)lireInvitation();
  if(APPLI_INSTALLEE&&!window.MOCK_API&&!apiConf()){ecranConnexion();return;}
  FILE=(lsGet('anziama_file')||[]).map(function(o){o.enVol=false;return o});
  var c=lsGet('anziama_D');
  if(c&&c.d){Dserv=c.d;DERNIER_CHARGEMENT=new Date(c.at);reconstruire();appliquerApparence();majMarque();rendre();}
  else setTimeout(function(){if(!Dserv){var m=document.getElementById('msgChargement');if(m)m.innerHTML='Google met du temps à répondre…<br><small>Connexion lente ? Patiente encore un peu.<br>Sur téléphone : ouvre le lien dans Chrome ou Safari (pas dans WhatsApp), avec un seul compte Google connecté.</small>';}},15000);
  chargerServeur();
}
function chargerServeur(){
  return call('getData',{logo:MEDIAS.logo.v||'',fond:MEDIAS.fond.v||''}).then(function(d){
    ['logo','fond'].forEach(function(k){var m=d.medias&&d.medias[k];if(!m)return;
      if(m.data!==undefined){MEDIAS[k]={v:m.v,data:m.data,sombre:MEDIAS[k].sombre};lsSet('anziama_media_'+k,MEDIAS[k]);
        if(k==='fond'&&m.data)luminanceImage(m.data).then(function(l){MEDIAS.fond.sombre=l<0.55;lsSet('anziama_media_fond',MEDIAS.fond);appliquerFond();});}});
    delete d.medias;Dserv=d;EN_LIGNE=true;DERNIER_CHARGEMENT=new Date();
    sauverCache();reconstruire();appliquerApparence();majMarque();rendreSiLibre();majEtat();
    if(d.version!==VERSION_ATTENDUE)toast('Attention : le programme Code.gs n\'est pas à jour (version '+(d.version||'1')+').',1);
    envoyer();
  }).catch(function(e){
    if(estRefusCode(e)){ecranConnexion('Google refuse ce code. Retape-le (menu 🏛 Complexe Anziama > Code secret de l\'appli installée, dans ton Google Sheets). Visiteur : demande le nouveau lien au propriétaire.');return;}
    EN_LIGNE=!estReseau(e);majEtat();
    if(!Dserv){document.getElementById('main').innerHTML='<div class="chargement"><div class="grand">ANZIAMA</div><div>Impossible de charger les données.</div><small>'+esc(e.message||e)+'</small><button class="btn prim" onclick="location.reload()">Réessayer</button>'+(APPLI_INSTALLEE&&!window.MOCK_API?'<button class="btn" style="margin-top:8px" onclick="ecranConnexion()">Changer l\'adresse ou le code secret</button>':'')+'</div>';}
    else toast(estReseau(e)?'Hors ligne : tu travailles sur la copie gardée sur cet appareil.':'Actualisation impossible : '+(e.message||e),1);
  });
}

function validerConnexion(ev){
  ev.preventDefault();var f=ev.target,url=f.url.value.trim(),cle=f.cle.value.trim().toUpperCase();

  var resteM=m?Math.max(0,r2(s.duMois(m)-(s.credit[m]||0))):0,dedM=m&&s.ded[m]?s.ded[m]:[],pc=g==='charge'?partChoisie(f,s):null;
  if(g==='charge'){var libre=!pc;['lblNature','lblMoisCh'].forEach(function(id){var z=document.getElementById(id);if(z)z.style.display=libre?'':'none'});}
  if(V.enc._init||(g==='charge'&&document.activeElement===f.part)){var val='';
    if(g==='complet')val=b.devise==='CDF'?Math.round(resteM*n2(P.taux)):r2(resteM);
    if(g==='garantie')val=Math.min(resteM,Math.max(0,s.g.solde));
    if(g==='charge'){if(pc){val=pc.devise==='CDF'?Math.round(pc.resteMont):r2(pc.resteMont);f.devise.value=pc.devise;}else val=s.ch.reste||'';}
    if(g==='reparation')val=s.rep.reste||'';
    if(val!=='')f.montant.value=val;V.enc._init=false;}
  var nb=f.nb?parseInt(f.nb.value,10):1;
  if(g==='complet'&&f.nb&&document.activeElement===f.nb){var tot=0;for(var i=0;i<nb;i++){var mi=addM(m,i);tot+=Math.max(0,s.duMois(mi)-(s.credit[mi]||0));}f.montant.value=r2(tot);}
  var montant=n2(f.montant.value),dev=f.devise.value,taux=pc&&dev==='CDF'&&pc.devise==='CDF'?pc.taux:n2(P.taux),enUSD=dev==='CDF'?montant/taux:montant;
  document.getElementById('aideMontant').textContent=dev==='CDF'?'≈ '+usdTxt(enUSD)+' au taux de '+fnum(taux,0)+' FC':'';
  var am=document.getElementById('aideMois');if(am)am.textContent=m?'Payable le '+fd(ds(echeance(m,b)))+(dedM.length?' · '+dedM.map(function(d){return usdTxt(d.v)+' déduits ('+d.p.objet+')'}).join(', '):''):'';
  var info='';
  if(g==='complet'||g==='partiel'||g==='garantie'){
    if(g==='complet'&&nb>1)info='Ce paiement couvrira '+nb+' mois : de '+mLib(m)+' à '+mLib(addM(m,nb-1))+'. Un reçu sera fait pour chaque mois.';
    else{var apres=r2(resteM-enUSD);info=apres>0.009?'Après ce paiement, il restera <b>'+usd(apres)+'</b> à payer pour '+mLib(m)+'.':apres<-0.009?'Attention : c\'est '+usd(-apres)+' de plus que ce qui reste dû pour '+mLib(m)+'.':'Le loyer de '+mLib(m)+' sera entièrement payé.';
      if(m&&s.duMois(m)<s.loyer-0.009)info+=' Loyer réduit ce mois-là : '+usd(s.duMois(m))+' au lieu de '+usd(s.loyer)+'.';
      if(dedM.length)info+=' Le loyer de '+usd(s.duMois(m))+' est réduit de '+usd(dedM.reduce(function(t,d){return t+d.v},0))+' pour les travaux préfinancés.';}
    if(g==='garantie')info+=' La garantie passera de '+usd(s.g.solde)+' à <b>'+usd(s.g.solde-enUSD)+'</b>.';
  }
  if(g==='charge')info=pc?'Facture '+pc.nature+' de '+mLib(pc.m)+' : sa part est de '+mont(pc.partMont,pc.devise)+', il a déjà payé '+mont(pc.payeMont,pc.devise)+'.':'Factures SNEL / Regideso à rembourser : '+usd(s.ch.reste)+'.';
  if(g==='reparation')info='Réparations à sa charge non remboursées : '+usd(s.rep.reste)+'. Ce paiement sera noté avec un reçu.';
  if(g==='complement')info='La garantie passera de '+usd(s.g.solde)+' à <b>'+usd(s.g.solde+enUSD)+'</b>.';
  document.getElementById('infoEnc').innerHTML=info;
}
function encValider(ev){
  ev.preventDefault();
  var f=ev.target,b=bail(V.enc.bail),g=V.enc.genre,s=ST[b.id];
  var montant=n2(f.montant.value),dev=f.devise.value;if(montant<=0){toast('Indique le montant reçu.',1);return}
  var base=lirePayePercu(f,{date:(f.date.value||MAINTENANT()).slice(0,16),bail:b.id,local:b.local,devise:dev,mode:f.mode?f.mode.value:'',reference:f.reference?f.reference.value:'',estimee:'Non',commentaire:f.commentaire.value});
  if(g==='reparation'&&f.objet.value)base.commentaire=f.objet.value+(base.commentaire?' — '+base.commentaire:'');
  var type={complet:'Loyer',partiel:'Loyer',garantie:'Prélèvement garantie',complement:'Complément garantie',reparation:'Paiement réparation'}[g];
  var lots=[],conv=function(v){return dev==='CDF'?r2(v/n2(P.taux)):v},desc='';
  if(g==='charge'){var pc=partChoisie(f,s),usdv=pc&&dev==='CDF'&&pc.devise==='CDF'?r2(montant/pc.taux):conv(montant);
    lots.push(Object.assign({},base,{type:pc?pc.nature+' refacturée':f.type.value,mois:(pc?pc.m:f.moisCh.value)+'-01',montant:montant,usd:usdv}));desc='Part '+(pc?pc.nature+' '+mLib(pc.m):f.type.value)+' — '+b.local;}
  else if(g==='complet'&&parseInt(f.nb.value,10)>1){
    var nb=parseInt(f.nb.value,10),restes=[],tot=0;
    for(var i=0;i<nb;i++){var mi=addM(f.mois.value,i),r=Math.max(0,s.duMois(mi)-(s.credit[mi]||0));restes.push([mi,r]);tot+=r;}
    restes.forEach(function(x){var part=tot?r2(montant*x[1]/tot):r2(montant/nb);lots.push(Object.assign({},base,{type:type,mois:x[0]+'-01',montant:part,usd:conv(part)}));});
    desc='Loyers '+mLib(f.mois.value)+' (+'+(nb-1)+') — '+b.local;
  } else {lots.push(Object.assign({},base,{type:type,mois:f.mois?f.mois.value+'-01':mk(base.date)+'-01',montant:montant,usd:conv(montant)}));desc=type+(f.mois?' '+mLib(f.mois.value):'')+' — '+b.local;}
  V.enc={bail:'',genre:'complet'};
  var op=soumettre({kind:'save',list:lots.map(function(o){return {table:'Journal',obj:o}}),desc:desc,apres:recuPret});
  if(op)toastAnnulable('Paiement enregistré',op.uid);
}
function recuPret(r){var recs=((r.delta||{}).recs||[]).filter(function(x){return x.rec.recu});if(!recs.length)return;
  toastAction('Reçu '+recs.map(function(x){return x.rec.recu}).join(', ')+' prêt','Voir le reçu',function(){ouvrirRecu(recs.map(function(x){return x.rec.id}))});}

/** Combien de locataires ont payé leur part de cette facture, et ce qu'il reste à percevoir. */
function etatFacture(F){var payes=0,reste=0;F.occ.forEach(function(b){var x=(ST[b.id]?ST[b.id].parts:[]).find(function(p){return p.nature===F.nature&&p.m===F.m});if(x){if(x.resteUSD<=0.01)payes++;reste+=x.resteMont*(F.partMont/(x.partMont||1));}});return {payes:payes,reste:reste};}
function ouvrirFacture(jid){
  var F=FC.find(function(x){return x.j.id===jid});if(!F)return;
  var c='<div class="resume-bail"><div><span>Facture</span><b>'+F.nature+' de '+mLib(F.m)+'</b></div><div><span>Montant total</span><b>'+mont(F.j.montant,F.devise)+'</b></div><div><span>Locaux occupés</span><b>'+F.n+'</b></div><div><span>Part de chacun</span><b>'+mont(F.partMont,F.devise)+'</b></div></div>';
  c+='<div class="tab-wrap"><table class="t"><thead><tr><th>Local</th><th>Locataire</th><th class="d">Part</th><th class="d">Payé</th><th class="d">Reste</th><th>État</th><th></th></tr></thead><tbody>'+
    F.occ.map(function(b,i){var x=ST[b.id].parts.find(function(p){return p.nature===F.nature&&p.m===F.m})||{};var reste=x.resteMont||0;
      return '<tr class="'+(i%2?'z':'')+'"><td><b>'+b.local+'</b></td><td>'+esc(nomBail(b))+'</td><td class="d">'+mont(x.partMont||0,F.devise)+'</td><td class="d">'+mont(x.payeMont||0,F.devise)+'</td><td class="d'+(reste>0.5?' neg':'')+'">'+mont(reste,F.devise)+'</td><td>'+pastilleMois({statut:x.statut||'impayé'})+'</td><td class="d">'+(x.resteUSD>0.01?'<button class="btn mini" onclick="payerRapide(\''+b.id+'\',\''+F.m+'\',\'charge\',\''+x.cle+'\')">Encaisser</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>';
  c+='<p class="muet" style="font-size:13px">Locaux occupés en '+mLib(F.m)+' : même règle que pour les loyers (entré après le 15 = à partir du mois suivant ; parti avant le 15 = mois non compté).</p>';
  fenetre('Facture '+F.nature+' commune',c,'<button class="btn gauche danger" onclick="supprimer(\'Journal\',\''+F.j.id+'\',\'cette facture\')">Supprimer</button><button class="btn" onclick="editerOp(\''+F.j.id+'\')">Modifier la facture</button><button class="btn prim" onclick="fermer()">Fermer</button>',true);
}
function depMaj(){var f=document.getElementById('fDep');if(!f)return;if(f.type.value==='__pref'){f.type.value='Entretien';ouvrirPref(null);return;}var t=f.type.value,charge=t==='SNEL payée'||t==='Regideso payée',z=document.getElementById('aideDep');

  f.commentaire.required=autre;f.commentaire.placeholder=autre?'Ex. : achat d\'un cadenas, frais de gardiennage…':'Ex. : réparation de la porte, facture n°…';
  if(charge){var m=f.mois.value,occ=D.baux.filter(function(b){return occupeMois(b,m)}),n=occ.length,mt=n2(f.montant.value),dev=f.devise.value;

    else{var b=bailActif(f.local.value);z.style.display='';z.textContent=b?'Facture d\'un seul local : à rembourser par '+nomBail(b)+'.':'Ce local n\'a pas de locataire actif.';}}

function depValider(ev){ev.preventDefault();var f=ev.target,m=n2(f.montant.value),dev=f.devise.value,t=f.type.value,charge=t.indexOf('payée')>0,b=f.local.value?bailActif(f.local.value):null;

function cartePrefs(){
  var L=[];D.baux.forEach(function(b){(ST[b.id]?ST[b.id].prefs:[]).forEach(function(x){L.push({b:b,x:x})})});

    '<p style="margin:0 0 12px;color:var(--doux);font-size:14px">Le locataire paie lui-même des travaux du local. Tu le rembourses en retirant une somme de son loyer chaque mois. Exemple : loyer de 80 $, déduction de 20 $. Il ne paie que 60 $, et le mois compte quand même comme payé. <b>À l\'encaissement, note seulement ce qu\'il donne vraiment (60 $)</b> : les 20 $ sont déduits tout seuls, mois après mois, jusqu\'à ce que la somme avancée soit remboursée.</p>';

    L.map(function(o,i){var x=o.x;return '<tr class="cliq'+(i%2?' z':'')+'" onclick="ouvrirPref(\''+x.p.id+'\')"><td><b>'+o.b.local+'</b></td><td><div class="ell">'+esc(nomBail(o.b))+'</div></td><td class="x-mob"><div class="ell">'+esc(x.p.objet)+'</div></td><td class="d x-mob">'+usd(x.p.total)+'</td><td class="d">'+usd(x.p.deduction)+'</td><td class="d"><b>'+usd(x.reste)+'</b></td><td>'+(x.reste>0.009?(tel?MOISC[+x.finPrevue.slice(5,7)-1]+' '+x.finPrevue.slice(2,4):mLib(x.finPrevue)):'<span class="pastille p-ok">Fini</span>')+'</td></tr>'}).join('')+'</tbody></table></div></div>';

function ouvrirSortie(id){
  if(!id){fenetre('Sortie d\'un locataire','<label class="ch">Quel locataire s\'en va ?<select id="choixSortie"><option value="">Choisir…</option>'+optsBaux('',function(b){return b.statut==='Actif'})+'</select></label><p style="color:var(--doux);font-size:14px">Pour régler la garantie d\'un ancien locataire, ouvre sa fiche dans « Locataires et baux » ou dans « Garanties ».</p>',
      '<button class="btn" onclick="fermer()">Annuler</button><button class="btn prim" onclick="var v=document.getElementById(\'choixSortie\').value;if(v)ouvrirSortie(v)">Continuer</button>');return;}
  var b=bail(id);V.sortie={id:id,date:b.fin||TODAY(),retenue:0,motif:'',deduire:{},rendu:true};sortieAff();
}
function sortieCalc(){
  var S=V.sortie,b=bail(S.id),s=calculBail(b,S.date);
  var impayes=s.lignes.filter(function(l){return l.reste>0.009});
  impayes.forEach(function(l){if(S.deduire[l.m]===undefined)S.deduire[l.m]=true});
  var aDeduire=impayes.filter(function(l){return S.deduire[l.m]}).reduce(function(t,l){return t+l.reste},0);
  return {b:b,s:s,impayes:impayes,aDeduire:r2(aDeduire),final:r2(s.g.solde-aDeduire-s.ch.reste-s.rep.reste-n2(S.retenue))};
}

    '<div class="l"><span>− Loyers déjà pris sur la garantie</span><span class="m">'+usd(s.g.prel)+'</span></div>'+

    (s.g.remb?'<div class="l"><span>− Déjà rendu au locataire</span><span class="m">'+usd(s.g.remb)+'</span></div>':'')+

    (k.impayes.length?'<div class="mois">'+k.impayes.map(function(l){return '<label><input type="checkbox" '+(S.deduire[l.m]?'checked':'')+' onchange="V.sortie.deduire[\''+l.m+'\']=this.checked;sortieAff()"> '+mLib(l.m)+' : '+usd(l.reste)+(l.statut==='partiel'?' (reste d\'un paiement partiel)':'')+'</label>'}).join('')+'<div style="margin-top:4px">Décoche un mois si tu ne le factures pas : il sera noté comme remise.</div></div>':'<div class="mois">Aucun loyer impayé.</div>')+

  if(k.final>0)c+='<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" '+(S.rendu?'checked':'')+' onchange="V.sortie.rendu=this.checked"> J\'ai rendu ces '+usdTxt(k.final)+' au locataire</label>';

  fenetre(cloture?'Régler la garantie':'Sortie du locataire',c,'<button class="btn" onclick="fermer()">Annuler</button><button class="btn" onclick="imprimerSortie()">'+ico('imprimer')+'Imprimer le décompte</button><button class="btn prim" onclick="sortieValider()">'+(cloture?'Enregistrer le règlement':'Valider la sortie')+'</button>',true);
}
function sortieValider(){
  var S=V.sortie,k=sortieCalc(),b=k.b,lots=[],dispo=Math.max(0,k.s.g.solde),d=S.date||TODAY();
  var base={date:MAINTENANT(),bail:b.id,local:b.local,devise:'USD',mode:'',reference:'',estimee:'Non'};
  if(b.statut==='Actif'||b.fin!==S.date)lots.push({table:'Baux',obj:{id:b.id,fin:S.date,statut:'Clôturé'}});
  k.impayes.forEach(function(l){
    if(S.deduire[l.m]){var v=r2(Math.min(l.reste,dispo));if(v>0){dispo-=v;lots.push({table:'Journal',obj:Object.assign({},base,{type:'Prélèvement garantie',mois:l.m+'-01',montant:v,usd:v,commentaire:'Déduit de la garantie à la sortie'})});}}
    else lots.push({table:'Journal',obj:Object.assign({},base,{type:'Remise accordée',mois:l.m+'-01',montant:l.reste,usd:l.reste,commentaire:'Non facturé à la sortie'})});
  });
  if(k.s.ch.reste>0&&dispo>0){
    k.s.parts.filter(function(x){return x.resteUSD>0.01}).forEach(function(x){if(dispo<=0)return;var v=r2(Math.min(x.resteUSD,dispo));dispo-=v;lots.push({table:'Journal',obj:Object.assign({},base,{type:x.nature+' refacturée',mois:x.m+'-01',montant:v,usd:v,mode:'Déduit de la garantie',commentaire:'Part de facture déduite de la garantie'})});});
    var autres=r2(k.s.ch.reste-k.s.parts.reduce(function(t,x){return t+x.resteUSD},0));
    if(autres>0.01&&dispo>0){var v1=r2(Math.min(autres,dispo));dispo-=v1;lots.push({table:'Journal',obj:Object.assign({},base,{type:'SNEL refacturée',mois:mk(d)+'-01',montant:v1,usd:v1,mode:'Déduit de la garantie',commentaire:'Factures non remboursées, déduites de la garantie'})});}
  }
  if(k.s.rep.reste>0&&dispo>0){var v2=r2(Math.min(k.s.rep.reste,dispo));dispo-=v2;lots.push({table:'Journal',obj:Object.assign({},base,{type:'Paiement réparation',mois:mk(d)+'-01',montant:v2,usd:v2,mode:'Déduit de la garantie',commentaire:'Réparations déduites de la garantie'})});}
  if(n2(S.retenue)>0){var w=r2(Math.min(n2(S.retenue),dispo));dispo-=w;
    if(w>0)lots.push({table:'Journal',obj:Object.assign({},base,{type:'Retenue garantie',mois:mk(d)+'-01',montant:w,usd:w,commentaire:S.motif||'Réparations'})});
    var manque=r2(n2(S.retenue)-w);if(manque>0)lots.push({table:'Journal',obj:Object.assign({},base,{type:'Réparation à charge du locataire',mois:mk(d)+'-01',montant:manque,usd:manque,commentaire:(S.motif||'Réparations')+' (non couvert par la garantie)'})});}
  if(k.final>0&&S.rendu)lots.push({table:'Journal',obj:Object.assign({},base,{type:'Remboursement garantie',mois:mk(d)+'-01',montant:k.final,usd:k.final,mode:'Espèces',commentaire:'Solde de garantie rendu au locataire'})});
  if(!lots.length){toast('Rien à enregistrer.');return}
  fermer();
  var op=soumettre({kind:'save',list:lots,desc:(b.statut==='Actif'?'Sortie de ':'Garantie de ')+nomBail(b)+' ('+b.local+')'});
  if(op)toastAnnulable(b.statut==='Actif'?'Sortie enregistrée':'Garantie réglée',op.uid);
}
function imprimerSortie(){
  var S=V.sortie,k=sortieCalc(),b=k.b,s=k.s;
  var lignes=[['Garantie versée à l\'entrée',s.g.versee],['Compléments de garantie',s.g.comp],['Loyers déjà pris sur la garantie',-s.g.prel],['Retenues déjà faites',-s.g.ret],['Déjà rendu',-s.g.remb],['Loyers impayés déduits',-k.aDeduire],['Factures SNEL / Regideso non remboursées',-s.ch.reste],['Réparations non remboursées',-s.rep.reste],['Retenue réparations'+(S.motif?' ('+S.motif+')':''),-n2(S.retenue)]].filter(function(x){return Math.abs(x[1])>0.009||x[0].indexOf('versée')>=0});
  imprimer(docTete('Décompte de garantie',fd(S.date))+'<div class="doc-info"><div><span>Locataire</span>'+esc(nomBail(b))+'</div><div><span>Local</span>'+b.local+'</div><div><span>Bail</span>'+b.id+'</div><div><span>Entrée / sortie</span>'+fd(b.debut)+' – '+fd(S.date)+'</div></div>'+
    '<table class="t"><tbody>'+lignes.map(function(x,i){return '<tr class="'+(i%2?'z':'')+'"><td>'+x[0]+'</td><td class="d">'+(x[1]<0?'− ':'')+usdTxt(Math.abs(x[1]))+'</td></tr>'}).join('')+'<tr class="tot"><td>'+(k.final>=0?'Montant rendu au locataire':'Reste dû par le locataire')+'</td><td class="d">'+usdTxt(Math.abs(k.final))+'</td></tr></tbody></table>'+
    '<div class="signatures"><span>Signature du bailleur</span><span>Signature du locataire</span></div>'+docPied());
}

    liste.map(function(b,i){var g=ST[b.id].g,et;

    '<tr class="tot"><td colspan="4">Locataires actuels</td><td class="d">'+usd(tot.v)+'</td><td class="d">'+usd(tot.p)+'</td><td></td><td></td><td class="d">'+usd(tot.s)+'</td><td></td><td></td><td></td></tr></tbody></table></div>';
  h+='<p style="color:var(--doux-page,var(--doux));font-size:14px;margin-top:12px">« En caisse » : ce qu\'il reste de la garantie aujourd\'hui. « Si départ aujourd\'hui » : la garantie en caisse moins ce que le locataire doit encore. Les retenues sont les sommes gardées sur la garantie au départ d\'un locataire pour des dégâts ou des réparations.</p>';
  return h;
};

    liste.map(function(j,i){var b=bail(j.bail);return '<tr class="cliq'+(i%2?' z':'')+'" onclick="'+(estCommune(j)?'ouvrirFacture':'editerOp')+'(\''+j.id+'\')"><td>'+fd(j.date)+attenteIco(j)+'</td><td>'+(j.local||'Complexe')+'</td>'+(simple?'':'<td>'+esc(b?nomBail(b):'')+'</td>')+'<td>'+esc(libOp(j))+(j.commentaire&&j.type!=='Autre dépense'?'<div class="muet" style="font-size:12.5px">'+esc(j.commentaire)+'</div>':'')+'</td><td class="d">'+mont(j.montant,j.devise)+'</td></tr>'}).join('')+'</tbody></table></div>';

/** Lignes « Non payé » : un loyer ou une part de facture encore due, pour chaque local et chaque mois. */
function nonPayes(mode){
  var out=[];if(mode==='aucun')return out;
  D.baux.forEach(function(b){if(mode==='actuels'&&b.statut!=='Actif')return;var s=ST[b.id];
    s.lignes.forEach(function(l){if(l.reste>0.009)out.push({virtuel:'loyer',id:'NP-'+b.id+'-'+l.m,bail:b.id,local:b.local,mois:l.m+'-01',montant:l.reste,devise:'USD',usd:l.reste,type:'Loyer non payé',partiel:l.statut==='partiel',date:''});});
    s.parts.forEach(function(x){if(x.resteUSD>0.01)out.push({virtuel:'charge',cle:x.cle,id:'NPC-'+b.id+'-'+x.cle,bail:b.id,local:b.local,mois:x.m+'-01',montant:x.resteMont,devise:x.devise,usd:x.resteUSD,type:'Part '+x.nature+' non payée',partiel:x.statut==='partiel',date:''});});
  });
  return out;
}
VUES.operations=function(){
  var F=V.ops,q=(F.q||'').toLowerCase();
  var tout=D.journal.concat(nonPayes(F.np));
  var liste=tout.filter(function(j){var k=periode(j)||'';
    if(F.annee!=='tout'&&k.slice(0,4)!==F.annee)return false;
    if(F.mois&&k.slice(5,7)!==F.mois)return false;
    if(F.local&&j.local!==F.local)return false;

    '<label class="ch">Payé comment ?<select name="mode">'+optsModes('Espèces')+(kind==='loyer'&&b.statut==='Actif'?'<option value="__garantie">Pris sur la garantie</option>':'')+'</select></label>'+

function rapValider(ev,bid,m,kind,cle){ev.preventDefault();var f=ev.target,b=bail(bid),s=ST[bid],x=kind==='charge'?s.parts.find(function(p){return p.cle===cle}):null;

var CAT_PREF='Préfinancé par un locataire';
function surfaceM2(l){var m=String(l&&l.surface||'').replace(/,/g,'.').match(/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/i);return m?+m[1]*+m[2]:0}
function dureeTxt(n){if(n==null)return '—';if(n<=0)return 'Récupéré';var a=Math.floor(n/12),m=n%12;return (a?a+' an'+(a>1?'s':''):'')+(a&&m?' ':'')+(m?m+' mois':'');}
function calculConstruction(){
  var terrain=P.constTerrain==='Oui',surf=P.constRepartition==='Surface';
  var locs=D.locaux.filter(function(l){return l.statut!=='Retiré'}),poids={},totP=0;
  locs.forEach(function(l){poids[l.id]=surf?surfaceM2(l):1;totP+=poids[l.id]});
  if(!totP){surf=false;locs.forEach(function(l){poids[l.id]=1});totP=locs.length||1;}
  /* Les travaux saisis ici, puis les travaux préfinancés par un locataire (déjà notés ailleurs) */
  var L=(D.travaux||[]).map(function(t){return {t:t,usd:n2(t.usd),paye:t.etat!=='À venir',compte:t.categorie!=='Terrain'||terrain,pref:false}});
  (D.prefinancements||[]).forEach(function(p){L.push({t:{id:p.id,mois:mk(p.date)||mk(p.premierMois),local:p.local,categorie:CAT_PREF,objet:p.objet,montant:p.total,devise:'USD',etat:'Payé'},usd:n2(p.total),paye:true,compte:true,pref:true})});
  var tot={paye:0,avenir:0,communPaye:0,communAvenir:0},cats={},parLoc={};
  locs.forEach(function(l){parLoc[l.id]={l:l,propre:0,propreAvenir:0,commun:0,communAvenir:0,percu:0}});
  L.forEach(function(x){if(!x.compte)return;var k=x.paye?'paye':'avenir';tot[k]+=x.usd;
    var c=cats[x.t.categorie||'Autre']=cats[x.t.categorie||'Autre']||{paye:0,avenir:0};c[k]+=x.usd;
    if(x.t.local&&parLoc[x.t.local]){if(x.paye)parLoc[x.t.local].propre+=x.usd;else parLoc[x.t.local].propreAvenir+=x.usd;}
    else if(x.paye)tot.communPaye+=x.usd;else tot.communAvenir+=x.usd;});
  /* Ce que les loyers ont rapporté depuis le début du suivi */
  var R={loyers:0,ded:0,avant:n2(P.constLoyersAvant),autres:0,charges:0,factPayees:0,factRecup:0};
  D.journal.forEach(function(j){var v=n2(j.usd),t=j.type;
    if(t==='Loyer'||t==='Prélèvement garantie'){R.loyers+=v;if(parLoc[j.local])parLoc[j.local].percu+=v;}
    else if(t==='Autre recette'||t==='Paiement réparation'||t==='Retenue garantie')R.autres+=v;
    else if(t==='Entretien'||t==='Taxe'||t==='Autre dépense')R.charges+=v;
    else if(t==='SNEL payée'||t==='Regideso payée')R.factPayees+=v;
    else if(t==='SNEL refacturée'||t==='Regideso refacturée')R.factRecup+=v;});
  D.baux.forEach(function(b){var s=ST[b.id];Object.keys(s.ded).forEach(function(m){if(s.mf.mois.indexOf(m)<0)return;s.ded[m].forEach(function(d){R.ded+=d.v;if(parLoc[b.local])parLoc[b.local].percu+=d.v;})})});
  R.factNettes=Math.max(0,R.factPayees-R.factRecup);
  R.net=r2(R.loyers+R.ded+R.avant+R.autres-R.charges-R.factNettes);
  /* Rythme actuel : loyers des baux en cours, moins les charges moyennes d'un mois */
  var suivi=mk(P.debutSuivi)||mk(TODAY()),dernier=addM(mk(TODAY()),-1),nbMois=0,m=suivi;while(m<=dernier&&nbMois<600){nbMois++;m=addM(m,1);}
  var actifs=D.baux.filter(function(b){return b.statut==='Actif'});
  R.loyersMois=actifs.reduce(function(s,b){return s+loyerUSD(b)},0);
  R.chargesMois=nbMois?Math.max(0,(R.charges+R.factNettes-R.autres)/nbMois):0;R.nbMois=nbMois;
  R.rythme=r2(R.loyersMois-R.chargesMois);
  var cout=r2(tot.paye+tot.avenir);
  var res={L:L,tot:tot,cats:cats,R:R,cout:cout,surf:surf,terrain:terrain,
    pct:tot.paye?R.net/tot.paye:null,pctTotal:cout?R.net/cout:null,
    reste:Math.max(0,r2(tot.paye-R.net)),resteTotal:Math.max(0,r2(cout-R.net)),
    rendement:cout&&R.rythme>0?R.rythme*12/cout:null};
  res.delai=res.reste<=0?0:R.rythme>0?Math.ceil(res.reste/R.rythme):null;
  res.delaiTotal=res.resteTotal<=0?0:R.rythme>0?Math.ceil(res.resteTotal/R.rythme):null;
  res.locaux=locs.map(function(l){var x=parLoc[l.id],b=bailActif(l.id),loyer=b?loyerUSD(b):0;
    x.commun=tot.communPaye*poids[l.id]/totP;x.communAvenir=tot.communAvenir*poids[l.id]/totP;
    x.cout=x.propre+x.commun;x.coutTotal=x.cout+x.propreAvenir+x.communAvenir;x.b=b;x.loyer=loyer;
    x.pct=x.coutTotal?x.percu/x.coutTotal:null;x.reste=Math.max(0,x.coutTotal-x.percu);
    x.delai=x.reste<=0.009?0:loyer>0?Math.ceil(x.reste/loyer):null;return x;});
  return res;
}
